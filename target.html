<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高二冲刺 Dashboard</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f3af.png">
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f3af.png">

    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --sub: #94a3b8;
            --blue: #38bdf8; --green: #4ade80; --red: #f43f5e; --orange: #fb923c; --yellow: #fbbf24; --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 12px; line-height: 1.4; }
        
        .header { text-align: center; margin-bottom: 12px; }
        .header h1 { font-size: 20px; color: var(--blue); margin-bottom: 4px; }
        .header p { font-size: 11px; color: var(--sub); }
        
        .time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .time-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; }
        .time-card .label { font-size: 11px; color: var(--sub); }
        .time-card .value { font-size: 20px; font-weight: 800; color: var(--yellow); }
        
        .sop-card { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--blue); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .sop-title { font-size: 13px; font-weight: 700; color: var(--blue); margin-bottom: 8px; }
        .sop-item { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px; cursor: pointer; }
        .sop-check { width: 18px; height: 18px; border: 2px solid var(--sub); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: transparent; }
        .sop-item.done .sop-check { background: var(--green); border-color: var(--green); color: #fff; }
        .sop-item.done .sop-text { text-decoration: line-through; color: var(--sub); }

        .sjtu-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .sjtu-header { font-size: 13px; font-weight: 700; color: var(--red); margin-bottom: 10px; border-left: 3px solid var(--red); padding-left: 8px; }
        .vocab-info { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); margin-bottom: 4px; }
        .vocab-bar-bg { background: rgba(255,255,255,0.05); height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
        .vocab-bar-fill { background: linear-gradient(90deg, var(--red), var(--orange)); height: 100%; transition: width 0.5s ease; }
        .sjtu-focus { font-size: 11px; color: var(--sub); }
        .sjtu-focus span { color: var(--text); font-weight: 600; }

        .habit-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-left: 8px; border-left: 3px solid var(--green); }
        .habit-header .title { font-size: 14px; font-weight: 600; }
        .habit-header .streak { font-size: 12px; color: var(--orange); font-weight: 700; }
        .habit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
        .habit-btn { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; text-align: center; cursor: pointer; position: relative; }
        .habit-btn.completed { border-color: var(--green); background: rgba(74, 222, 128, 0.08); }
        .habit-icon { font-size: 20px; margin-bottom: 4px; display: block; }
        .habit-name { font-size: 12px; font-weight: 600; }
        .habit-check { position: absolute; top: 4px; right: 4px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 8px; color: transparent; }
        .habit-btn.completed .habit-check { background: var(--green); border-color: var(--green); color: #fff; }

        /* 新增：平均分追踪模块样式 */
        .avg-tracker { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0; }
        .avg-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; position: relative; overflow: hidden; }
        .avg-card .label { font-size: 11px; color: var(--sub); margin-bottom: 4px; }
        .avg-card .value { font-size: 20px; font-weight: 800; color: var(--text); }
        .avg-card::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; }
        .avg-c1::after { background: var(--blue); }
        .avg-c2::after { background: var(--yellow); }
        .avg-c3::after { background: var(--green); }
        .avg-c4::after { background: var(--red); }
        .avg-c4 .value { color: var(--green); text-shadow: 0 0 5px rgba(74,222,128,0.3); }

        .section-title { font-size: 14px; font-weight: 600; margin: 16px 0 10px 0; padding-left: 8px; border-left: 3px solid var(--blue); display: flex; justify-content: space-between; align-items: center;}
        .reset-btn { font-size: 10px; color: var(--sub); background: none; border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; }
        
        .subject-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; position: relative; }
        .subject-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; border-radius: 10px 0 0 10px; }
        .subject-card.type-core::before { background: var(--blue); }
        .subject-card.type-attitude::before { background: var(--green); }
        .subject-card.type-danger::before { background: var(--red); }
        .subject-card.bg-danger { background: rgba(244, 63, 94, 0.08); border-color: rgba(244, 63, 94, 0.4); }
        .subject-card.bg-safe { background: rgba(74, 222, 128, 0.08); border-color: rgba(74, 222, 128, 0.4); }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .subject-name { font-size: 14px; font-weight: 600; }
        .subject-tags { display: flex; gap: 4px; }
        .tag { font-size: 9px; padding: 2px 5px; border-radius: 3px; font-weight: 600; }
        .tag-weight { background: rgba(244, 63, 94, 0.2); color: var(--red); }
        .tag-core { background: rgba(56, 189, 248, 0.15); color: var(--blue); }
        .tag-attitude { background: rgba(74, 222, 128, 0.15); color: var(--green); }
        .tag-danger { background: rgba(244, 63, 94, 0.15); color: var(--red); }

        .targets-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-bottom: 10px; background: rgba(0,0,0,0.2); padding: 6px; border-radius: 6px; }
        .target-item { text-align: center; }
        .target-label { font-size: 9px; color: var(--sub); margin-bottom: 2px; }
        .target-val { font-size: 13px; font-weight: 700; color: var(--text); }

        .score-row { display: flex; justify-content: space-between; align-items: center; }
        .current-val { font-size: 18px; font-weight: 800; color: var(--yellow); cursor: pointer; border-bottom: 1px dashed var(--sub); }
        .current-val.empty { color: var(--sub); font-size: 14px; }
        .score-input { width: 60px; font-size: 18px; font-weight: 800; background: transparent; border: none; border-bottom: 2px solid var(--blue); color: var(--yellow); text-align: center; outline: none; }
        
        .gap-indicator { font-size: 11px; font-weight: 700; padding: 3px 6px; border-radius: 4px; }
        .gap-danger { background: rgba(244, 63, 94, 0.2); color: var(--red); }
        .gap-safe { background: rgba(74, 222, 128, 0.2); color: var(--green); }
        .gap-wait { background: rgba(148, 163, 184, 0.15); color: var(--sub); }
    </style>
</head>
<body>
    <div class="header">
        <h1>高二冲刺作战指挥系统</h1>
        <p>校内加权90+拿门票 | 交大笔试是战场</p>
    </div>

    <div class="time-grid">
        <div class="time-card">
            <div class="label">第一段考试 (26.12.2)</div>
            <div class="value" id="days-p1">--</div>
        </div>
        <div class="time-card">
            <div class="label">寒假解放 (27.1.31)</div>
            <div class="value" id="days-break">--</div>
        </div>
    </div>

    <div class="sop-card">
        <div class="sop-title">🎯 今日只做这三件事 (SOP)</div>
        <div id="sop-list">
            <div class="sop-item" data-sop="0"><div class="sop-check">✓</div><div class="sop-text">刷30个英语单词</div></div>
            <div class="sop-item" data-sop="1"><div class="sop-check">✓</div><div class="sop-text">背3个文言实词/文学常识</div></div>
            <div class="sop-item" data-sop="2"><div class="sop-check">✓</div><div class="sop-text">搞定一道理科压轴题</div></div>
        </div>
    </div>

    <div class="sjtu-card">
        <div class="sjtu-header">🔥 交大笔试专项</div>
        <div class="vocab-info"><span>📖 英语词汇量 (目标4500)</span><span id="vocab-text">2797 / 4500</span></div>
        <div class="vocab-bar-bg"><div class="vocab-bar-fill" id="vocab-fill" style="width: 62.1%"></div></div>
        <div class="sjtu-focus">
            📖 语文：<span>文言文实词/默写 / 答题公式</span><br>
            📐 数学：<span>内地高考/交大风格压轴题</span>
        </div>
    </div>

    <div class="habit-header">
        <div class="title">✅ 每日极客打卡</div>
        <div class="streak" id="streak-display">🔥 连续 0 天</div>
    </div>
    <div class="habit-grid" id="habit-grid"></div>

    <!-- 新增：阶段平均分追踪 -->
    <div class="avg-tracker">
        <div class="avg-card avg-c1"><div class="label">第一段目标</div><div class="value">86.5</div></div>
        <div class="avg-card avg-c2"><div class="label">第二段目标</div><div class="value">89.0</div></div>
        <div class="avg-card avg-c3"><div class="label">第三段目标</div><div class="value">91.1</div></div>
        <div class="avg-card avg-c4"><div class="label">🎯 学年目标</div><div class="value">90.0+</div></div>
    </div>

    <div class="section-title">
        <span> 校内加权成绩与缺口预警</span>
        <div style="display:flex; gap:8px; align-items:center;">
            <span id="current-avg-display" style="font-size:12px; color:var(--yellow); font-weight:bold;"></span>
            <button class="reset-btn" onclick="resetScores()">重置</button>
        </div>
    </div>
    <div id="subject-list"></div>

    <script>
        var CONFIG = {
            vocab: { current: 2797, target: 4500 },
            habits: [
                { id: 'english', icon: '📖', name: '背单词30个' }, 
                { id: 'chinese', icon: '📜', name: '文言/常识' },
                { id: 'github', icon: '💻', name: 'GitHub Commit' }, 
                { id: 'sport', icon: '🏃', name: '体育特训' }, 
                { id: 'review', icon: '📝', name: '错题清零' }
            ],
            subjects: [
                { id: 'math', name: '数学', weight: 1.5, t1: 94, t2: 96, t3: 98, tag: '王牌', type: 'core' },
                { id: 'chinese', name: '中文', weight: 1.5, t1: 76, t2: 78, t3: 80, tag: '核心', type: 'danger' }, 
                { id: 'english', name: '英文', weight: 1.5, t1: 82, t2: 85, t3: 88, tag: '提分', type: 'core' },
                { id: 'business', name: '商业数据', weight: 1.0, t1: 94, t2: 96, t3: 97, tag: '王牌', type: 'core' },
                { id: 'material', name: '材料化学', weight: 1.0, t1: 93, t2: 95, t3: 96, tag: '王牌', type: 'core' },
                { id: 'multimedia', name: '多媒体', weight: 1.0, t1: 88, t2: 92, t3: 95, tag: '极客', type: 'core' },
                { id: 'hcia', name: 'HCIA AI', weight: 1.0, t1: 88, t2: 92, t3: 95, tag: '极客', type: 'core' },
                { id: 'physics', name: '物理', weight: 1.0, t1: 91, t2: 93, t3: 94, tag: '中坚', type: 'core' },
                { id: 'ict', name: 'ICT网络', weight: 1.0, t1: 91, t2: 93, t3: 94, tag: '中坚', type: 'core' },
                { id: 'civic', name: '公民', weight: 1.0, t1: 85, t2: 89, t3: 92, tag: '态度', type: 'attitude' },
                { id: 'social', name: '社会人文', weight: 1.0, t1: 86, t2: 89, t3: 92, tag: '态度', type: 'attitude' },
                { id: 'biology', name: '生命科学', weight: 1.0, t1: 87, t2: 89, t3: 92, tag: '态度', type: 'attitude' },
                { id: 'sport', name: '体育', weight: 1.0, t1: 75, t2: 76, t3: 77, tag: '红线', type: 'danger' }
            ]
        };

        function getStorage(key) { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch(e) { return {}; } }
        function setStorage(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

        function updateTime() {
            var now = new Date();
            var d1 = Math.ceil((new Date('2026-12-02') - now) / 86400000);
            var d2 = Math.ceil((new Date('2027-01-31') - now) / 86400000);
            document.getElementById('days-p1').innerText = d1 > 0 ? d1 : 0;
            document.getElementById('days-break').innerText = d2 > 0 ? d2 : 0;
        }

        function renderVocab() {
            var c = CONFIG.vocab.current; var t = CONFIG.vocab.target;
            document.getElementById('vocab-text').innerText = c + ' / ' + t;
            document.getElementById('vocab-fill').style.width = Math.min(100, (c / t) * 100).toFixed(1) + '%';
        }

        function renderHabits() {
            var grid = document.getElementById('habit-grid'); grid.innerHTML = '';
            var today = new Date().toDateString();
            var data = getStorage('habits_data');
            var streak = parseInt(localStorage.getItem('streak') || '0');
            document.getElementById('streak-display').innerText = '🔥 连续 ' + streak + ' 天';

            CONFIG.habits.forEach(function(h) {
                var btn = document.createElement('div');
                btn.className = 'habit-btn';
                btn.innerHTML = '<div class="habit-check">✓</div><span class="habit-icon">' + h.icon + '</span><div class="habit-name">' + h.name + '</div>';
                if (data.date === today && data.habits && data.habits[h.id]) btn.classList.add('completed');
                
                btn.onclick = function() {
                    btn.classList.toggle('completed');
                    var d = getStorage('habits_data'); d.date = today; if (!d.habits) d.habits = {};
                    d.habits[h.id] = btn.classList.contains('completed'); setStorage('habits_data', d);
                    
                    var s = parseInt(localStorage.getItem('streak') || '0');
                    var last = localStorage.getItem('lastDate');
                    if (btn.classList.contains('completed')) {
                        if (last !== today) {
                            var yest = new Date(Date.now() - 86400000).toDateString();
                            s = (last === yest) ? s + 1 : 1;
                            localStorage.setItem('streak', s); localStorage.setItem('lastDate', today);
                        }
                    }
                    document.getElementById('streak-display').innerText = '🔥 连续 ' + s + ' 天';
                };
                grid.appendChild(btn);
            });
        }

        function renderSubjects() {
            var list = document.getElementById('subject-list'); if (!list) return; list.innerHTML = '';
            var scores = getStorage('user_scores');
            var totalW = 0; var totalS = 0;

            var groups = [
                { title: '🔴 核心加权科 (x1.5)', items: CONFIG.subjects.filter(function(s){ return s.weight === 1.5; }) },
                { title: '🚀 王牌与极客主场', items: CONFIG.subjects.filter(function(s){ return s.weight === 1.0 && s.type === 'core'; }) },
                { title: '💡 态度提分科', items: CONFIG.subjects.filter(function(s){ return s.type === 'attitude'; }) },
                { title: '⚠️ 底线防守科', items: CONFIG.subjects.filter(function(s){ return s.type === 'danger' && s.weight === 1.0; }) }
            ];

            groups.forEach(function(g) {
                if (g.items.length === 0) return;
                var titleDiv = document.createElement('div'); titleDiv.className = 'section-title'; titleDiv.style.marginTop = '16px';
                titleDiv.innerText = g.title; list.appendChild(titleDiv);

                g.items.forEach(function(sub) {
                    var current = scores[sub.id];
                    var isFilled = (current !== undefined && current !== null && current !== '');
                    var gap = isFilled ? (sub.t3 - parseFloat(current)) : null;

                    if (isFilled) { totalS += parseFloat(current) * sub.weight; totalW += sub.weight; }

                    var gapHtml = '<span class="gap-indicator gap-wait">待考</span>'; var bgClass = '';
                    if (isFilled) {
                        var gapDisplay = gap % 1 === 0 ? gap : gap.toFixed(1);
                        if (gap > 0) { gapHtml = '<span class="gap-indicator gap-danger">🔴 缺口:' + gapDisplay + '</span>'; bgClass = 'bg-danger'; }
                        else { gapHtml = '<span class="gap-indicator gap-safe"> 安全</span>'; bgClass = 'bg-safe'; }
                    }

                    var wTag = sub.weight === 1.5 ? '<span class="tag tag-weight">x1.5</span>' : '';
                    var card = document.createElement('div'); card.className = 'subject-card type-' + sub.type + ' ' + bgClass;
                    card.innerHTML = 
                        '<div class="card-header"><span class="subject-name">' + sub.name + '</span><div class="subject-tags">' + wTag + '<span class="tag tag-' + sub.type + '">' + sub.tag + '</span></div></div>' +
                        '<div class="targets-grid"><div class="target-item"><div class="target-label">第一段</div><div class="target-val">' + sub.t1 + '</div></div><div class="target-item"><div class="target-label">第二段</div><div class="target-val">' + sub.t2 + '</div></div><div class="target-item"><div class="target-label">第三段</div><div class="target-val">' + sub.t3 + '</div></div></div>' +
                        '<div class="score-row"><div><span style="font-size:11px;color:var(--sub)">当前:</span> <span class="current-val ' + (!isFilled ? 'empty' : '') + '" onclick="editScore(\'' + sub.id + '\', this)">' + (isFilled ? current : '点击录入') + '</span></div>' + gapHtml + '</div>';
                    list.appendChild(card);
                });
            });

            // 更新当前预估均分
            var avgDisplay = document.getElementById('current-avg-display');
            if (totalW > 0) {
                var avg = (totalS / totalW).toFixed(1);
                avgDisplay.innerText = '当前均分: ' + avg;
                avgDisplay.style.color = avg >= 90 ? 'var(--green)' : 'var(--yellow)';
            } else {
                avgDisplay.innerText = '';
            }
        }

        window.editScore = function(id, el) {
            var scores = getStorage('user_scores'); var val = scores[id] !== undefined ? scores[id] : '';
            el.outerHTML = '<input type="number" inputmode="decimal" step="0.1" class="score-input" id="inp-' + id + '" value="' + val + '" placeholder="0-100">';
            var inp = document.getElementById('inp-' + id); inp.focus();
            var save = function() {
                var v = parseFloat(inp.value);
                if (isNaN(v) || v < 0 || v > 100) { renderSubjects(); return; }
                scores[id] = v; setStorage('user_scores', scores); renderSubjects();
            };
            inp.onblur = save; inp.onkeydown = function(e) { if (e.key === 'Enter') inp.blur(); };
        };

        window.resetScores = function() { if(confirm('确定清空所有分数？')) { localStorage.removeItem('user_scores'); renderSubjects(); } };

        function initSOP() {
            var today = new Date().toDateString(); var saved = getStorage('sop_data');
            var items = document.querySelectorAll('.sop-item');
            if (saved.date === today && saved.items) items.forEach(function(it, i) { if (saved.items[i]) it.classList.add('done'); });
            items.forEach(function(it) {
                it.onclick = function() {
                    it.classList.toggle('done');
                    var d = { date: today, items: [] }; items.forEach(function(i) { d.items.push(i.classList.contains('done')); });
                    setStorage('sop_data', d);
                };
            });
        }

        updateTime(); renderVocab(); renderHabits(); renderSubjects(); initSOP();
        setInterval(updateTime, 60000);
    </script>
</body>
</html>
