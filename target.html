<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上海交大保送作战面板</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --danger: #ff4c4c;
            --warning: #ffb84d;
            --success: #4caf50;
            --accent: #3b82f6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            line-height: 1.5;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
        }
        h1 { margin: 0; font-size: 24px; color: #fff; }
        .countdown { font-size: 18px; color: var(--warning); font-weight: bold; margin-top: 5px; }
        
        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        
        /* 分数条样式 */
        .score-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; font-weight: bold;}
        .progress-bg { background: #333; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 12px;}
        .progress-bar { height: 100%; transition: width 0.5s; }
        
        /* 专项任务样式 */
        .task-item {
            display: flex; align-items: center; margin-bottom: 10px; cursor: pointer;
            padding: 8px; background: #252525; border-radius: 6px;
        }
        .task-item input { margin-right: 10px; width: 18px; height: 18px; cursor: pointer;}
        .task-item.completed label { text-decoration: line-through; color: #777; }
        .task-desc { font-size: 12px; color: #888; margin-left: 28px; margin-top: -5px; margin-bottom: 10px;}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 交大保送作战面板</h1>
            <div class="countdown" id="countdown">距离决战还有: 计算中...</div>
        </header>

        <div class="grid">
            <!-- 核心成绩与缺口 -->
            <div class="card">
                <h2>📊 成绩与缺口分析</h2>
                <div id="scores-container"></div>
            </div>

            <!-- 交大笔试专项 -->
            <div class="card">
                <h2>⚔️ 交大笔试特训 (中英数)</h2>
                <div class="score-row"><span>英语词汇量 (目标4500)</span> <span id="vocab-text">2797 / 4500</span></div>
                <div class="progress-bg"><div class="progress-bar" id="vocab-bar" style="width: 62%; background: var(--warning);"></div></div>
                
                <div class="score-row"><span>语文基础分守住 (默写/文言)</span> <span>必须100%</span></div>
                <div class="progress-bg"><div class="progress-bar" style="width: 100%; background: var(--success);"></div></div>
                <p style="font-size:12px; color:#aaa; margin-top:5px;">* 语文是你的生死线，理科决定上限，语文决定你能不能进考场。</p>
            </div>

            <!-- 每日打卡 -->
            <div class="card" style="grid-column: 1 / -1;">
                <h2>🔥 每日极客打卡 (连续 <span id="streak">0</span> 天)</h2>
                <div id="tasks-container"></div>
                <button onclick="resetTasks()" style="margin-top:10px; background:#333; color:#fff; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">手动重置今日打卡</button>
            </div>
        </div>
    </div>

    <script>
        // ================= 数据配置区（每次考试后只改这里）=================
        const data = {
            chinese: { current: 69, target: 80, name: "语文" }, // 红色警报区
            english: { current: 82, target: 85, name: "英语" },
            math: { current: 100, target: 95, name: "数学" }, // 已经超神
            physics: { current: 95, target: 90, name: "物理" },
            chemistry: { current: 84, target: 88, name: "化学" },
            vocab: { current: 2797, target: 4500 }
        };

        const tasks = [
            { id: "t1", text: "🧠 语文：背 3 个文言文实词/虚词", desc: "死分，像背化学方程式一样" },
            { id: "t2", text: "📖 语文：做 1 篇阅读并总结踩分公式", desc: "不要凭感觉，要按点作答" },
            { id: "t3", text: "📱 英语：墨墨背单词 30新+100复习", desc: "词汇量是生命线" },
            { id: "t4", text: "📐 数理化：保持手感，刷题", desc: "你的王牌，绝不能掉" }
        ];

        // 决战日期：2027年交大保送考大概在高三上（2027年10月左右）
        const targetDate = new Date("2027-10-01T00:00:00").getTime();
        // ================================================================

        // 渲染成绩单
        const scoresDiv = document.getElementById("scores-container");
        for (const [key, item] of Object.entries(data)) {
            if(key === 'vocab') continue;
            let gap = (item.target - item.current).toFixed(1);
            let isDanger = gap > 5; // 缺口大于5分算危险
            let color = isDanger ? "var(--danger)" : (gap > 0 ? "var(--warning)" : "var(--success)");
            let width = Math.min((item.current / item.target) * 100, 100);
            
            let gapText = gap > 0 ? `缺口: ${gap}分` : `超目标: ${Math.abs(gap)}分`;
            
            scoresDiv.innerHTML += `
                <div class="score-row">
                    <span style="color: ${isDanger ? 'var(--danger)' : 'var(--text)'}">${item.name}</span>
                    <span style="color: ${color}">${item.current} / ${item.target} (${gapText})</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-bar" style="width: ${width}%; background: ${color};"></div>
                </div>
            `;
        }

        // 渲染词汇量
        document.getElementById("vocab-text").innerText = `${data.vocab.current} / ${data.vocab.target}`;
        let vocabPct = (data.vocab.current / data.vocab.target) * 100;
        document.getElementById("vocab-bar").style.width = `${vocabPct}%`;

        // 倒计时逻辑
        setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById("countdown").innerText = `距离决战还有: ${days} 天`;
        }, 1000);

        // 打卡逻辑 (LocalStorage)
        const taskContainer = document.getElementById("tasks-container");
        let completedTasks = JSON.parse(localStorage.getItem("tasks_" + new Date().toDateString())) || [];
        let streak = parseInt(localStorage.getItem("streak")) || 0;

        function renderTasks() {
            taskContainer.innerHTML = "";
            tasks.forEach(task => {
                const isChecked = completedTasks.includes(task.id);
                taskContainer.innerHTML += `
                    <div>
                        <label class="task-item ${isChecked ? 'completed' : ''}">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleTask('${task.id}')">
                            <span>${task.text}</span>
                        </label>
                        <div class="task-desc">${task.desc}</div>
                    </div>
                `;
            });
            document.getElementById("streak").innerText = streak;
        }

        function toggleTask(id) {
            if (completedTasks.includes(id)) {
                completedTasks = completedTasks.filter(t => t !== id);
            } else {
                completedTasks.push(id);
            }
            localStorage.setItem("tasks_" + new Date().toDateString(), JSON.stringify(completedTasks));
            
            // 简单的连续天数逻辑
            if(completedTasks.length === tasks.length) {
                let lastDone = localStorage.getItem("lastDone");
                let today = new Date().toDateString();
                if(lastDone !== today) {
                    streak++;
                    localStorage.setItem("streak", streak);
                    localStorage.setItem("lastDone", today);
                }
            }
            renderTasks();
        }

        function resetTasks() {
            completedTasks = [];
            localStorage.setItem("tasks_" + new Date().toDateString(), JSON.stringify(completedTasks));
            renderTasks();
        }

        renderTasks();
    </script>
</body>
</html>
